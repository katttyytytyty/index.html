<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .envelope-wrapper:hover {
            transform: scale(1.05);
        }
        .envelope {
            width: 200px;
            height: 140px;
            background: #ff4d6d;
            position: relative;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-top: 80px solid #ff758f;
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 3;
        }
        .open.envelope::before {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .heart-click {
            position: absolute;
            top: 40px;
            left: 85px;
            font-size: 30px;
            color: white;
            z-index: 4;
            animation: pulse 1.5s infinite;
        }
        .open .heart-click { display: none; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .letter {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 180px;
            height: 120px;
            background: white;
            border-radius: 5px;
            transition: transform 0.5s ease, opacity 0.5s;
            z-index: 2;
            padding: 15px;
            box-sizing: border-box;
            opacity: 0;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .open .letter {
            transform: translateY(-130px) scale(1.4);
            opacity: 1;
            z-index: 5;
            height: auto;
            max-width: 280px;
            width: 250px;
            left: -25px;
        }
        .letter h1 { font-size: 16px; color: #ff4d6d; margin: 0 0 10px 0; }
        .letter p { font-size: 11px; color: #333; line-height: 1.4; margin: 0; }
        .heart {
            position: absolute;
            color: #ff4d6d;
            pointer-events: none;
            animation: float Up 4s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="envelope-wrapper" onclick="openLetter(this)">
    <div class="envelope">
        <div class="heart-click">❤️</div>
        <div class="letter">
            <h1>Для тебя! ❤️</h1>
            <!-- ТУТ ВАШ ТЕКСТ (МОЖНО МЕНЯТЬ) -->
            <p>Ты — моё самое дорогое чудо! Раз уж ты открыл этот конверт и посыпались сердечки, знай: моя любовь к тебе безгранична. Этот сайт создан специально для тебя, и он будет работать всегда, напоминая о моих чувствах. Люблю тебя!</p>
        </div>
    </div>
</div>

<script>
    function openLetter(element) {
        element.classList.add('open');
        for (let i = 0; i < 40; i++) {
            setTimeout(createHeart, i * 150);
        }
    }

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = Math.random() * 20 + 10 + 'px';
        heart.style.animationDuration = Math.random() * 2 + 2 + 's';
        document.body.appendChild(heart);
        setTimeout(() => { heart.remove(); }, 4000);
    }
</script>

</body>
</html>
